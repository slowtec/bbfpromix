[package]
name = "bbfpromix"
description = "ALSA Mixer Frontend for RME Babyface Pro (FS)"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.89"
authors = ["Markus Kohlhase <markus.kohlhase@slowtec.de>"]
readme = "README.md"
homepage = "https://github.com/slowtec/bbfpromix"
repository = "https://github.com/slowtec/bbfpromix"

[dependencies]
alsa-sys = "0.3.1"
anyhow = "1.0.99"
env_logger = "0.11.8"
gio-sys = "0.21.1"
glib-sys = "0.21.1"
gobject-sys = "0.21.1"
gtk-sys = "0.18.2"
log = "0.4.28"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
